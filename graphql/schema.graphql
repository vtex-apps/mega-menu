type Query {
  menus(isMobile: Boolean): [Menu]
  menu(id: ID!): Menu
  settings: [Settings]
  setting(id: ID!): Settings
}

type Mutation {
  editMenu(menuInput: MenuInput!): [Menu] @auth(scope: PRIVATE, productCode: "147", resourceCode: "storefront.mega-menu.edit")
  deleteMenu(id: String, idSecond: String, idThird: String): [Menu] @auth(scope: PRIVATE, productCode: "147", resourceCode: "storefront.mega-menu.edit")
  createMenu(menuInput: MenuInput!): Menu @auth(scope: PRIVATE, productCode: "147", resourceCode: "storefront.mega-menu.edit")
  uploadMenu(menuData: [MenuInput]): [Menu] @auth(scope: PRIVATE, productCode: "147", resourceCode: "storefront.mega-menu.edit")
  createEditSettings(settingsInput: SettingsInput!): Settings @auth(scope: PRIVATE, productCode: "147", resourceCode: "storefront.mega-menu.edit")
}
